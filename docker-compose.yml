services:
  app:
    build: .
    # AI modified: the supervisor grace period exceeds the complete 17-second application shutdown budget.
    stop_grace_period: 25s
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: gnester
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_DATABASE: gnester
      DB_SYNCHRONIZE: false
      DB_AUTO_LOAD_ENTITIES: true
      DB_RETRY_ATTEMPTS: 10
      DB_RETRY_DELAY: 3000
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      SESSION_ENABLED: false
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-gnester-lite}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gnester-lite}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      HMAC_SECRET: ${HMAC_SECRET:?HMAC_SECRET is required}
      SENTRY_DSN: ''
      SENTRY_ENABLED: 'false'
      SENTRY_TRACES_SAMPLE_RATE: '0.1'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build: .
    command:
      [
        'node',
        'node_modules/typeorm/cli.js',
        '-d',
        'dist/config/typeorm.data-source.js',
        'migration:run',
      ]
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: gnester
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_DATABASE: gnester
      DB_SYNCHRONIZE: false
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: gnester
      MYSQL_USER: gnester
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # AI modified: readiness no longer places database credentials in process arguments.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
