# CN: 配置文件，定义 configuration 的默认参数；EN: Config file defines default settings for configuration.
app:
  name: gnester-lite

cache:
  ttl: 0

schedule:
  # AI modified: keep schedule off by default to match docs/tests and avoid multi-instance duplicate jobs.
  enabled: false
  timeZone: Asia/Shanghai

queue:
  enabled: true
  prefix: gnester-lite
  defaultAttempts: 3
  backoffDelay: 1000
  removeOnComplete: 1000
  removeOnFail: 5000

http:
  baseUrl: https://jsonplaceholder.typicode.com
  timeout: 5000
  maxRedirects: 5
  maxContentLength: 10485760
  maxBodyLength: 10485760

rateLimit:
  enabled: true
  trustProxy: loopback
  errorMessage: Too many requests
  throttlers:
    - name: short
      ttl: 1000
      limit: 3
    - name: medium
      ttl: 10000
      limit: 20
    - name: long
      ttl: 60000
      limit: 100
